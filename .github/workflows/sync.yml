name: Daily Main Website Sync

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync scraper
        run: node scripts/sync-data.js

      - name: Commit and push changes if updated
        run: |
          git config --global user.name 'GIST Data Sync Bot'
          git config --global user.email 'csehod@gist.edu.in'
          git diff --quiet || (git add src/lib/department-data.ts && git commit -m "Auto-sync: update department data from main website" && git push)
